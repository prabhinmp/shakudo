apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deploy-ui.fullname" . }}
  labels: {{- include "deploy-ui.labels" . | nindent 4 }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      server_tokens off;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path       /tmp/proxy_temp;
      fastcgi_temp_path     /tmp/fastcgi_temp;
      uwsgi_temp_path       /tmp/uwsgi_temp;
      scgi_temp_path        /tmp/scgi_temp;

      server {
        listen 8080;
        client_max_body_size 64k;
        absolute_redirect off;   # behind an ingress the container port (8080) must not leak into redirects

        location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
        location = / { return 302 /ui/; }

        location /ui/ {
          root /usr/share/nginx/html;            # dist is copied to <root>/ui
          index index.html;
          try_files $uri $uri/ /ui/index.html;   # client-side routes (e.g. /ui/deployments/<id>)
          # add_header is NOT inherited once a location sets its own, so every location repeats the security headers.
          add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "no-referrer" always;
          add_header Cache-Control "no-cache" always;
        }

        # API calls go to the backend Service (stable ClusterIP, resolved by the pod's own DNS at start-up).
        location /api/ {
          proxy_pass http://{{ include "deploy-ui.backendFqdn" . }}:{{ .Values.backend.port }};
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $remote_addr;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_read_timeout {{ .Values.backend.readTimeout }};
          add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
          add_header X-Content-Type-Options "nosniff" always;
          add_header X-Frame-Options "DENY" always;
          add_header Referrer-Policy "no-referrer" always;
          add_header Cache-Control "no-store" always;
        }
      }
    }
