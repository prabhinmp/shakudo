{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deploy-ui.fullname" . }}
  labels: {{- include "deploy-ui.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "deploy-ui.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:   # DNS
        - namespaceSelector: {}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - to:   # the backend pods (post-DNAT port, not the Service port)
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.backendPodLabels | nindent 14 }}
      ports:
        - {port: 8080, protocol: TCP}
{{- end }}
