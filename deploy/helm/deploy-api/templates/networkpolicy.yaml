{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "deploy-api.fullname" . }}
  labels: {{- include "deploy-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "deploy-api.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - {port: 8080, protocol: TCP}
  egress:
    - to:   # DNS
        - namespaceSelector: {}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    - {{- if .Values.networkPolicy.apiServerCidr }}
      to:
        - ipBlock: {cidr: {{ .Values.networkPolicy.apiServerCidr | quote }}}
      {{- end }}
      ports:   # Kubernetes API server
        {{- range .Values.networkPolicy.apiServerPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
{{- end }}
