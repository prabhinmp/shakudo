{{- if not .Values.jwt.existingSecret }}
{{- $name := include "deploy-api.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "deploy-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep   # don't delete the signing key on uninstall (avoids silent rotation)
type: Opaque
data:
  {{ .Values.jwt.secretKey }}: {{ if $existing }}{{ index $existing.data .Values.jwt.secretKey }}{{ else }}{{ randAlphaNum 48 | b64enc }}{{ end }}
{{- end }}
