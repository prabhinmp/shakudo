apiVersion: v1
kind: Service
metadata:
  name: {{ include "deploy-api.fullname" . }}
  labels: {{- include "deploy-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "deploy-api.selectorLabels" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
